services:
  payload:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides the host-oriented value in .env: inside the compose network
      # Postgres is reachable as 'postgres', not 'localhost'.
      DATABASE_URL: postgres://bookeh:bookeh@postgres:5432/bookeh

  postgres:
    # The tag pins the Alpine release and with it the ICU library; 16.x
    # minors still move. A new tag may ship a new ICU, which requires REINDEX
    # and REFRESH COLLATION VERSION on every database (see README, Database).
    image: postgres:16-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookeh
      POSTGRES_PASSWORD: bookeh
      POSTGRES_DB: bookeh
      # Finnish ICU collation as the cluster default (NFR-7, AD-7). Only
      # applied when the data directory is empty; see README, Database.
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=fi-FI
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U bookeh -d bookeh']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    # Fixed name so the README's `docker volume rm bookeh_pgdata` does not
    # depend on the Compose project name.
    name: bookeh_pgdata
  node_modules:
