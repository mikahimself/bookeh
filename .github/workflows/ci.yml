name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  # Branch/PR runs cancel each other; main runs queue instead, so an in-flight
  # publish is never killed — every main commit's SHA tag must reach GHCR
  # (the LXC's compose can pin a full SHA via BOOKEH_IMAGE_TAG).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Mirrors docker-compose.yml: same image, credentials, init args and
        # healthcheck.
        image: postgres:16-alpine3.24
        env:
          POSTGRES_USER: bookeh
          POSTGRES_PASSWORD: bookeh
          POSTGRES_DB: bookeh
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=fi-FI
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U bookeh -d bookeh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bookeh:bookeh@localhost:5432/bookeh
      # CI-only value; never a real secret.
      PAYLOAD_SECRET: ci-only-payload-secret-not-for-production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Follows the Dockerfile's node:22.23.3-alpine.
          node-version: 22.23.3
          cache: npm

      # Services start before checkout, so the Compose init script cannot be
      # mounted; create bookeh_test the same way (inherits template1's locale).
      - run: docker exec ${{ job.services.postgres.id }} createdb -U bookeh bookeh_test

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # Fails when the config differs from the newest committed migration
      # snapshot, i.e. a schema change was committed without its migration.
      # No database needed. stdin is closed, so a drizzle-kit prompt (e.g. an
      # ambiguous rename) reads EOF and exits 0 without writing; the step
      # fails unless Payload logged that both diffs finished. That log line
      # comes from @payloadcms/drizzle/dist/utilities/buildCreateMigration.js
      # (Payload 3.90.2); recheck its wording on a Payload bump.
      - name: Check for missing migrations
        run: |
          out="$(npm run payload -- migrate:create ci_drift_check --skip-empty </dev/null 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          if ! grep -q "Migration DOWN statements generation complete" <<<"$out"; then
            echo "::error::migrate:create did not finish (likely a prompt, e.g. an ambiguous rename). Run it locally to resolve."
            exit 1
          fi
          drift="$(git status --porcelain -- src/migrations)"
          if [ -n "$drift" ]; then
            echo "::error::Schema changed without a migration. migrate:create would write:"
            echo "$drift"
            cat src/migrations/*_ci_drift_check.ts
            exit 1
          fi

      # Builds the empty bookeh_test from the committed migrations; the int
      # tests below run on it with push off.
      - name: Apply migrations to bookeh_test
        run: npm run payload -- migrate </dev/null
        env:
          DATABASE_URL: postgres://bookeh:bookeh@localhost:5432/bookeh_test

      - run: npm run test:unit
      - run: npm run test:int
        env:
          DATABASE_PUSH: 'false'
      # A dev push writes a batch -1 row; there must be none, or push was on.
      - name: Check push stayed off
        run: |
          pushes="$(docker exec ${{ job.services.postgres.id }} psql -U bookeh -d bookeh_test -tAc "select count(*) from payload_migrations where batch = -1")"
          if [ "$pushes" != "0" ]; then
            echo "::error::bookeh_test was schema-pushed during test:int (DATABASE_PUSH not honoured)."
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Builds the production image, smoke-runs it, and pushes it to GHCR on every
  # push to main once check has passed. Story 2.2's LXC only ever pulls; it
  # never builds — so nothing that cannot serve may reach the registry.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        # Mirrors the check job: same image, credentials, init args and
        # healthcheck.
        image: postgres:16-alpine3.24
        env:
          POSTGRES_USER: bookeh
          POSTGRES_PASSWORD: bookeh
          POSTGRES_DB: bookeh
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=fi-FI
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U bookeh -d bookeh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bookeh:bookeh@localhost:5432/bookeh
      # CI-only value; never a real secret.
      PAYLOAD_SECRET: ci-only-payload-secret-not-for-production

    steps:
      - uses: actions/checkout@v7

      # Build without pushing; load the image into the local daemon so it can
      # be smoke-run before anything reaches GHCR.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bookeh:smoke

      # The image that builds but cannot serve must not ship: start it against
      # the EMPTY service Postgres — the container itself must apply the
      # migrations via prodMigrations (that is how the LXC database is built)
      # and seed the first user — then require the sign-in page plus one
      # static asset it references, and a login whose session cookie carries
      # Secure (the production-only cookie branch).
      - name: Smoke-run the image
        run: |
          docker run -d --name smoke --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PAYLOAD_SECRET="$PAYLOAD_SECRET" \
            -e SEED_EMAIL="smoke@bookeh.test" \
            -e SEED_PASSWORD="ci-only-smoke-password" \
            bookeh:smoke
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/login && break
            sleep 2
          done
          page="$(curl -fsS http://localhost:3000/login)" || { docker logs smoke; exit 1; }
          grep -qi bookeh <<<"$page"
          asset="$(grep -o '/_next/static/[^"]*' <<<"$page" | head -1)"
          test -n "$asset"
          curl -fsS -o /dev/null "http://localhost:3000$asset"
          login="$(curl -is -X POST http://localhost:3000/api/users/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@bookeh.test","password":"ci-only-smoke-password"}')"
          grep -i '^set-cookie: payload-token' <<<"$login" | grep -qi Secure \
            || { echo "payload-token cookie is not Secure"; docker logs smoke; exit 1; }
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow's own token; no PAT.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild-and-push is free: the build cache from the smoke build is
      # reused. Full commit SHA (what the LXC's compose file references)
      # + latest.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mikahimself/bookeh:${{ github.sha }}
            ghcr.io/mikahimself/bookeh:latest
