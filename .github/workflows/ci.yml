name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Mirrors docker-compose.yml: same image, credentials and healthcheck.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookeh
          POSTGRES_PASSWORD: bookeh
          POSTGRES_DB: bookeh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookeh -d bookeh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bookeh:bookeh@localhost:5432/bookeh
      # CI-only value; never a real secret.
      PAYLOAD_SECRET: ci-only-payload-secret-not-for-production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Follows the Dockerfile's node:22.23.3-alpine.
          node-version: 22.23.3
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:int
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
